services:
  vault:
    image: hashicorp/vault:latest
    container_name: vault
    restart: unless-stopped
    ports:
      - '8200:8200'
    cap_add:
      - IPC_LOCK
    profiles:
      - vault
    env_file:
      - .env
    environment:
      VAULT_ADDR: "https://${VAULT_HOST}:8200"
      VAULT_API_ADDR: "https://${VAULT_HOST}:8200"
      VAULT_CACERT: /vault/certs/vault-cert.pem
    volumes:
      - ./containers/vault/config:/vault/config
      - ./containers/vault/certs:/vault/certs
      - ./containers/vault/data:/vault/data
    entrypoint:
      - vault
      - server
      - -config=/vault/config/hcl.config

  postgres:
    image: postgres:15
    container_name: db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    profiles:
      - db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    profiles:
      - db
    depends_on:
      - postgres

volumes:
  postgres_data:

networks:
  default:
    name: backend-network
    driver: bridge
